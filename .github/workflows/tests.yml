name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest targets arm64 runners, which frequently fail to be
        # acquired under capacity pressure; the Intel image is still GA.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/coding_suite.py --validate-only
      - run: python -m compileall -q minimalcode tests main.py
      - run: ruff check minimalcode tests benchmarks main.py
      - run: ruff format --check minimalcode tests benchmarks main.py
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'minimalcode/defaults.json' in names, names"
