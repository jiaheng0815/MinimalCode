[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minimalcode"
dynamic = ["version"]
description = "A configurable coding agent with provider web tools and Responses/Chat/Anthropic support"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
keywords = ["coding-agent", "cli", "terminal", "openai", "anthropic", "deepseek", "openai-compatible", "multi-provider"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx2>=2.0,<3",
]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
minimalcode = "minimalcode.cli:main"

[project.urls]
Repository = "https://github.com/jiaheng0815/MinimalCode"
Issues = "https://github.com/jiaheng0815/MinimalCode/issues"
Changelog = "https://github.com/jiaheng0815/MinimalCode/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "minimalcode.__version__"}

[tool.setuptools.packages.find]
include = ["minimalcode*"]

[tool.setuptools.package-data]
minimalcode = ["defaults.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
