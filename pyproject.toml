[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimalcode"
dynamic = ["version"]
description = "A fast, minimal terminal coding agent with Responses and Chat API support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
minimalcode = "minimalcode.cli:main"

[project.urls]
Repository = "https://github.com/jiaheng0815/minimalcode"
Issues = "https://github.com/jiaheng0815/minimalcode/issues"

[tool.setuptools.dynamic]
version = {attr = "minimalcode.__version__"}

[tool.setuptools.packages.find]
include = ["minimalcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
