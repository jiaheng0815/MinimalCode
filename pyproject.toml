[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimalcode"
dynamic = ["version"]
description = "A configurable coding agent with provider web tools and Responses/Chat support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[project.scripts]
minimalcode = "minimalcode.cli:main"

[project.urls]
Repository = "https://github.com/jiaheng0815/MinimalCode"
Issues = "https://github.com/jiaheng0815/MinimalCode/issues"

[tool.setuptools.dynamic]
version = {attr = "minimalcode.__version__"}

[tool.setuptools.packages.find]
include = ["minimalcode*"]

[tool.setuptools.package-data]
minimalcode = ["defaults.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
